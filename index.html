<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nuestra Historia ❤️</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffdde1, #ee9ca7);
            color: white;
        }

        .pantalla {
            width: 90%;
            max-width: 500px;
        }

        h1 {
            font-size: 40px;
        }

        p {
            font-size: 20px;
            line-height: 1.6;
        }

        button {
            margin-top: 25px;
            padding: 15px 30px;
            border: none;
            border-radius: 30px;
            background: white;
            color: #e75480;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }

        #segundaPantalla,
        #terceraPantalla,
        #contadorPantalla {
            display: none;
        }
    </style>
</head>

<body>

    <!-- PRIMERA PANTALLA -->
    <div class="pantalla" id="primeraPantalla">

        <h1>Nuestra Historia ❤️</h1>

        <p>
            Todo comenzó con un momento
            que nunca olvidaré.
        </p>

        <button onclick="continuar()">
            Continuar ❤️
        </button>

    </div>


    <!-- SEGUNDA PANTALLA -->
    <div class="pantalla" id="segundaPantalla">

        <h1>Hay algo que quiero decirte ❤️</h1>

        <p>
            Desde que llegaste a mi vida,
            muchas cosas cambiaron.
        </p>

        <button onclick="mostrarTercera()">
            Seguir 💕
        </button>

    </div>


    <!-- TERCERA PANTALLA -->
    <div class="pantalla" id="terceraPantalla">

        <h1>¿Quieres continuar esta historia conmigo? ❤️</h1>

        <button onclick="aceptar()">
            Sí, quiero ❤️
        </button>

    </div>


    <!-- CONTADOR -->
    <div class="pantalla" id="contadorPantalla">

        <h1>❤️ Nuestra historia comienza aquí ❤️</h1>

        <p>Ha pasado:</p>

        <h2 id="contador">0 segundos</h2>

    </div>


    <script>

        // ==========================================
        // CONEXIÓN CON SUPABASE
        // ==========================================

        const SUPABASE_URL =
            "https://vwksswnwxmmrfpnuline.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_4ABY1on84G4J0taRCeUbpg_S9EIer9p";


        // ==========================================
        // CAMBIAR DE PANTALLA
        // ==========================================

        function continuar() {

            document.getElementById("primeraPantalla").style.display = "none";

            document.getElementById("segundaPantalla").style.display = "block";

        }


        function mostrarTercera() {

            document.getElementById("segundaPantalla").style.display = "none";

            document.getElementById("terceraPantalla").style.display = "block";

        }


        // ==========================================
        // CUANDO PULSA "SÍ, QUIERO"
        // ==========================================

        async function aceptar() {

            try {

                // Comprobar si ya existe un inicio
                const respuesta = await fetch(
                    SUPABASE_URL +
                    "/rest/v1/contador?select=id,inicio&order=inicio.asc&limit=1",
                    {
                        method: "GET",
                        headers: {
                            "apikey": SUPABASE_KEY,
                            "Authorization": "Bearer " + SUPABASE_KEY
                        }
                    }
                );

                const datos = await respuesta.json();


                // Si ya existe, usamos el inicio existente
                if (datos.length > 0) {

                    mostrarContador(datos[0].inicio);

                    return;
                }


                // Si no existe, ESTE es el momento en que comienza
                const momentoInicio = new Date().toISOString();


                const guardar = await fetch(
                    SUPABASE_URL + "/rest/v1/contador",
                    {
                        method: "POST",

                        headers: {
                            "apikey": SUPABASE_KEY,
                            "Authorization": "Bearer " + SUPABASE_KEY,
                            "Content-Type": "application/json",
                            "Prefer": "return=minimal"
                        },

                        body: JSON.stringify({
                            inicio: momentoInicio
                        })
                    }
                );


                if (!guardar.ok) {

                    throw new Error("No se pudo guardar el inicio.");

                }


                mostrarContador(momentoInicio);

            } catch (error) {

                console.error(error);

                alert(
                    "No se pudo conectar con el contador. Revisa la configuración de Supabase."
                );

            }

        }


        // ==========================================
        // MOSTRAR EL CONTADOR
        // ==========================================

        function mostrarContador(inicio) {

            document.getElementById("primeraPantalla").style.display = "none";

            document.getElementById("segundaPantalla").style.display = "none";

            document.getElementById("terceraPantalla").style.display = "none";

            document.getElementById("contadorPantalla").style.display = "block";


            actualizarContador(inicio);


            setInterval(function() {

                actualizarContador(inicio);

            }, 1000);

        }


        function actualizarContador(inicio) {

            const fechaInicio = new Date(inicio);

            const ahora = new Date();

            const diferencia = ahora - fechaInicio;


            const segundosTotales =
                Math.floor(diferencia / 1000);


            const dias =
                Math.floor(segundosTotales / 86400);


            const horas =
                Math.floor((segundosTotales % 86400) / 3600);


            const minutos =
                Math.floor((segundosTotales % 3600) / 60);


            const segundos =
                segundosTotales % 60;


            document.getElementById("contador").innerText =
                dias + " días, " +
                horas + " horas, " +
                minutos + " minutos y " +
                segundos + " segundos";

        }


        // ==========================================
        // COMPROBAR AL ABRIR LA PÁGINA
        // ==========================================

        async function comprobarContador() {

            try {

                const respuesta = await fetch(
                    SUPABASE_URL +
                    "/rest/v1/contador?select=id,inicio&order=inicio.asc&limit=1",
                    {
                        method: "GET",
                        headers: {
                            "apikey": SUPABASE_KEY,
                            "Authorization": "Bearer " + SUPABASE_KEY
                        }
                    }
                );


                const datos = await respuesta.json();


                // Si ya comenzó anteriormente,
                // mostrar directamente el contador.
                if (datos.length > 0) {

                    mostrarContador(datos[0].inicio);

                }

            } catch (error) {

                console.error(error);

            }

        }


        comprobarContador();

    </script>

</body>
</html>
